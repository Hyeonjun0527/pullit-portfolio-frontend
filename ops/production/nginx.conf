server {
    listen 18081;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /pull-it {
        return 308 /pull-it/;
    }

    # The URL exposed to the browser has this prefix, but its SigV4 signature is
    # calculated for MinIO's private endpoint. Keep both the rewritten URI and
    # Host identical to that endpoint so MinIO can verify the signature.
    location /pull-it/storage/ {
        rewrite ^/pull-it/storage/(.*)$ /$1 break;
        proxy_pass http://pullit-prod-storage:9000;
        proxy_set_header Host pullit-prod-storage:9000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # Pi 내부에서 직접 확인할 때도 공개 subpath와 같은 계약을 사용한다.
    # 공개 트래픽에서는 Yeon BFF가 이 경로를 Spring으로 바로 전달한다.
    location ^~ /pull-it/api/ {
        proxy_pass http://pullit-prod-app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /pull-it/auth/ {
        proxy_pass http://pullit-prod-app:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /pull-it/oauth2/ {
        proxy_pass http://pullit-prod-app:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /pull-it/login/oauth2/ {
        proxy_pass http://pullit-prod-app:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pull-it/ {
        rewrite ^/pull-it/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ @pullit_spa;
    }

    # Named location으로 넘겨 prefix rewrite와 분리한다. 외부의 /index.html은
    # 아래 location / 규칙으로 404가 되고, SPA 내부 fallback만 허용된다.
    location @pullit_spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
